[project]
name = "pibot"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.28",
    "groq>=1.4",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "colorama>=0.4",
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
